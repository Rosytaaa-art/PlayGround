rect(-18,37+stride,14,9,'#29252b');rect(4,37-stride,14,9,'#29252b');rect(-15,22+stride,12,17,'#d7c4a4');rect(4,22-stride,12,17,'#d7c4a4');
// coat body, collar and lapels
rect(-20,-2,40,31,coat);rect(-24,4,8,22,coat);rect(16,4,8,22,coat);rect(-16,25,32,5,coat);if(state.style===1){rect(-15,3,7,23,'#d7c6a8');rect(8,3,7,23,'#d7c6a8');rect(-3,4,6,24,'#593d36')}if(state.style===2){rect(-23,2,8,22,'#674743');rect(15,2,8,22,'#674743');rect(-8,-3,16,6,'#a94e46');rect(5,0,9,5,'#c7a263')}rect(-9,-1,8,12,'#e7d4b1');rect(1,-1,8,12,'#e7d4b1');rect(-3,6,6,5,'#bc935b');rect(0,13,2,2,'#e2bf79');rect(0,19,2,2,'#e2bf79');rect(-20,28,40,3,'#c49d64');
// head ears, face
rect(-15,-29,30,27,skin);rect(-19,-20,4,9,skin);rect(15,-20,4,9,skin);rect(-14,-32,28,6,hair);
if(state.hair===0){rect(-16,-32,7,9,hair);rect(8,-30,8,12,hair);rect(-13,-34,24,4,hair)}else if(state.hair===1){rect(-17,-34,35,7,hair);rect(-18,-28,8,13,hair);rect(11,-27,8,11,hair);rect(-9,-38,20,5,hair)}else{rect(-19,-34,10,9,hair);rect(-7,-38,11,8,hair);rect(5,-35,12,8,hair);rect(-19,-28,6,14,hair);rect(13,-28,7,13,hair);rect(-5,-28,10,5,hair)}
if(state.gender===0){rect(-8,-9,16,3,hair);rect(-6,-7,12,5,hair)}
rect(-8,-18,3,3,'#29252b');rect(5,-18,3,3,'#29252b');if(state.style===1){outline(-11,-20,9,7,'#705240');outline(3,-20,9,7,'#705240');rect(-2,-18,5,1,'#705240')}rect(-3,-11,6,2,'#a85e50');rect(-5,-4,10,2,skin);
// hat, brim, flower pin
rect(-19,-37,38,4,'#34252b');rect(-12,-44,25,9,'#3c2a30');rect(-10,-42,20,2,'#c09a5e');rect(12,-36,3,4,'#d5b370');
// hand and accessory
rect(19,15,7,8,skin);rect(-27,19,7,6,skin);rect(21,6,3,10,'#c49b62');ctx.restore();}
function drawPet(x,y,s){ctx.save();ctx.translate(x,y);if(state.mode==='play'&&state.moving)ctx.translate(0,Math.abs(Math.sin(state.stepPhase))*2);ctx.scale(s,s);if(state.pet===0){ // cat
rect(-16,-5,28,18,'#16161a');rect(-17,-15,18,16,'#111116');rect(-18,-23,6,9,'#111116');rect(-6,-24,7,10,'#111116');rect(-13,-11,3,3,'#d7b75f');rect(-5,-11,3,3,'#d7b75f');rect(-2,-5,15,13,'#16161a');rect(12,1,7,4,'#16161a');rect(16,-3,4,5,'#16161a');rect(-10,12,5,7,'#151519');rect(4,12,5,7,'#151519');rect(-4,-7,3,2,'#d48c83');}else if(state.pet===1){ // large brown and white dog
rect(-22,-7,38,20,'#80543a');rect(-18,-10,28,8,'#f1e4ce');rect(9,-15,16,17,'#a26c48');rect(22,-12,9,12,'#81513a');rect(12,-22,8,13,'#754a37');rect(21,-22,8,13,'#754a37');rect(14,-10,3,3,'#292127');rect(24,-10,3,3,'#292127');rect(19,-4,6,4,'#30242a');rect(-17,11,7,12,'#634335');rect(5,11,7,12,'#634335');rect(-25,-5,6,14,'#754a37');rect(-30,4,7,4,'#754a37');rect(-5,-7,8,20,'#f0e2ca');}else{ // yellow bird
rect(-12,-8,24,17,'#e3bd54');rect(-8,-17,18,13,'#efd16c');rect(-3,-20,6,5,'#d9b04b');rect(7,-13,4,4,'#252029');rect(10,-10,9,4,'#cf7950');rect(-5,8,3,7,'#9b7042');rect(4,8,3,7,'#9b7042');rect(-4,-5,12,9,'#f5df8b');rect(3,-2,4,3,'#c99a3f');}ctx.restore();}
function drawNPC(){const n=state.car===0?0:state.car===1?1:2;ctx.save();ctx.translate(477,190);ctx.scale(.95,.95);let c=['#573447','#365846','#41465c'][n];rect(-20,0,40,39,c);rect(-14,-34,28,28,'#d9ae88');rect(-17,-39,33,8,'#32262b');rect(-11,-48,23,11,'#443037');rect(-11,-24,4,3,'#25232a');rect(6,-24,4,3,'#25232a');rect(-5,-17,10,2,'#9d5e51');rect(-4,-7,8,8,'#e8d6b7');rect(-23,6,7,23,c);rect(16,6,7,23,c);rect(-15,36,12,8,'#28232a');rect(3,36,12,8,'#28232a');rect(0,1,2,29,'#caa76a');rect(11,7,3,3,'#e6c77e');ctx.restore();
// speech marker
rect(458,126,37,18,'#251e25');outline(458,126,37,18,'#d6b774');text('TALK',476,138,7,'#f3d999','center');rect(474,144,5,5,'#d6b774');}
function cluePosition(){return {x:state.car===0?182:state.car===1?530:81,y:state.car===0?237:state.car===1?214:235}}
function drawClue(){if(state.mode==='create')return;let {x,y}=cluePosition();if(state.clues.includes(state.car)){rect(x-9,y-7,18,12,'#d8c99e');rect(x-6,y-4,2,2,'#7c5240');return}if(state.car===0){rect(x-8,y-6,16,11,'#efe0bb');rect(x-8,y-6,7,4,'#9c4650');rect(x+5,y-6,3,7,'#72845c')}else if(state.car===1){rect(x-7,y-5,13,8,'#cba54e');rect(x+4,y-2,7,3,'#d9ba68');rect(x-2,y+2,3,8,'#cba54e')}else{rect(x-8,y-4,16,10,'#8e6847');rect(x-9,y-9,18,6,'#cfaa65');rect(x-1,y-2,3,6,'#ddb966')}}
const panel=document.getElementById('panel'),badge=document.getElementById('badge'),chapter=document.getElementById('chapter'),play=document.getElementById('play');
function renderPanel(){if(state.mode==='create'){panel.innerHTML=`<div class="eyebrow">Before the case begins</div><h1>Meet your detective.</h1><p class="intro">The Royal Night Mail is bound for Black Hollow. Somewhere aboard, a passenger has disappeared. First, let’s get you ready for the journey.</p><div class="section-title">Your name</div><div class="name-row"><input id="heroName" maxlength="16" placeholder="e.g. Alex Ashford" value="${esc(state.name)}" aria-label="Detective name"></div><div class="section-title">Character <span>01 — 02</span></div><div class="choices">${opts('gender')}</div><div class="section-title">Personal style</div><div class="choices">${opts('style')}</div><div class="section-title">Hairstyle</div><div class="choices">${opts('hair')}</div><div class="section-title">Complexion</div><div class="choices">${opts('skin')}</div><div class="section-title">Victorian attire</div><div class="choices">${opts('clothes')}</div><div class="rule"></div><div class="section-title">Choose your companion</div><div class="choices">${opts('pet')}</div><div class="name-row"><input id="petName" maxlength="14" placeholder="Name your ${optionData.pet[state.pet].toLowerCase()}" value="${esc(state.petName)}" aria-label="Pet name"></div><div class="mini-note">Your loyal companion will join you as you investigate all three carriages.</div>`;
play.innerHTML='▶ &nbsp; Board the train';play.style.display='block';document.getElementById('heroName').addEventListener('input',e=>state.name=e.target.value);document.getElementById('petName').addEventListener('input',e=>state.petName=e.target.value);document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state[b.dataset.group]=Number(b.dataset.value);renderPanel()});badge.innerHTML='NO. 07 &nbsp;·&nbsp; <span>THE ROYAL NIGHT MAIL</span>';chapter.textContent='A DETECTIVE STORY · 1891';}
else{const c=carriages[state.car],found=state.clues.length,done=found===3;panel.innerHTML=`<div class="eyebrow">${done?'Case concluded':'The mystery begins'}</div><h1>${done?'A name in the night.':c.name.replace('THE ','')}</h1><p class="intro">${done?'Three clues. One vanished passenger. And a culprit who never left the train.':c.sub+'. A passenger has vanished between stations. Ask questions, inspect the carriage, and piece together the truth.'}</p><div class="rule"></div><div class="section-title">Passenger of interest</div><div style="font:600 17px 'Playfair Display',serif;color:#3b2930;margin:6px 0 3px">${c.npc}</div><div class="mini-note">${c.role}</div><button class="choice" id="talk" style="margin:13px 0 14px;width:100%;padding:10px">◈ &nbsp; Speak with ${c.npc}</button><div class="section-title">Evidence collected <span>${found} / 3</span></div><div class="choices">${carriages.map((cc,i)=>`<button class="choice ${state.clues.includes(i)?'active':''}" data-evidence="${i}" style="flex:1;text-align:center">${state.clues.includes(i)?'✦ '+cc.clue:'? '+['Telegram','Brass key','Watch'][i]}</button>`).join('')}</div><div class="rule"></div><div class="section-title">Your companion</div><div style="font:600 15px 'Playfair Display',serif;color:#3b2930;margin:5px 0 3px">${esc(state.petName)||'Your companion'} <span style="font:9px 'DM Mono';color:#8b7964">· ${optionData.pet[state.pet]}</span></div><p class="mini-note">${done?'The clues point to the one person who could have arranged it all.':'Explore the other carriages with the arrow buttons. Look closely—important things are easy to miss.'}</p>${done?'<button class="choice" id="solve" style="width:100%;padding:11px;background:#653641;color:#f5e1bd">✦ &nbsp; Unmask the culprit</button>':''}`;
play.innerHTML=done?'✦ &nbsp; Solve the mystery':'↗ &nbsp; Explore carriage';play.style.display='block';badge.innerHTML=`NO. 0${state.car+7} &nbsp;·&nbsp; <span>${c.name}</span>`;chapter.textContent=`CHAPTER I · ${found} / 3 CLUES`;document.getElementById('talk').onclick=()=>talk();document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.evidence);if(state.clues.includes(i))say('Evidence log',`Collected: ${carriages[i].clue}. The details are recorded in your case notes.`);else{state.car=i;renderPanel();inspectClue()}});let solve=document.getElementById('solve');if(solve)solve.onclick=()=>finish();}
}
function opts(group){return optionData[group].map((v,i)=>`<button class="choice ${state[group]===i?'active':''}" data-group="${group}" data-value="${i}">${v}</button>`).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(who,words){document.getElementById('speaker').textContent=who.toUpperCase();document.getElementById('line').textContent=words;document.getElementById('dialogue').classList.add('show')}
function hideDialogue(){document.getElementById('dialogue').classList.remove('show')}
function talk(){if(state.mode==='create')return;if(Math.hypot(state.x-477,state.y-190)>105){state.target={x:430,y:225};showToast('Walk up to the passenger, then press E.');return}let c=carriages[state.car];if(!state.approached[state.car]){state.approached[state.car]=true;let openings=['You introduce yourself with a courteous bow. Lady Ashcombe studies your badge, then quietly invites you to sit.','You offer Finch a hand steadying the rattling tea tray. He gives you a grateful nod and lowers his voice.','You ask Dr. Vale about the stopped watch as a colleague, not an accuser. His guarded expression softens.'];say(c.npc,openings[state.car]);return}if(!state.progress)state.progress=[0,0,0];let progress=state.progress[state.car]||0;if(progress>=c.story.length){say(c.npc,'I’ve told you all I know, detective. Have you searched the other carriages?');return}say(c.npc,c.story[progress]);state.progress[state.car]++;if(state.progress[state.car]===c.story.length)state.met[state.car]=true}
function inspectClue(){if(state.mode==='create')return;let {x,y}=cluePosition();if(Math.hypot(state.x-x,state.y-y)>48){state.target={x,y:Math.max(230,y)};showToast('Move close to the evidence, then press E.');return}let words=['The telegram is torn cleanly in two. The remaining line reads: “…meet me in cabin six. 11:32. —V.”','A small brass luggage key, still warm. Its tag reads “CABIN 6”. Someone tried to hide it under the table.','A silver watch, stopped at 11:32. The engraved initials on the back: “E.V.”'];let c=state.car;if(state.clues.includes(c)){say('Case notes',`You have already secured the ${carriages[c].clue}. Its detail may matter later.`);return}state.clues.push(c);say('Evidence found',words[c]);renderPanel();showToast('CLUE ADDED TO YOUR CASE NOTES')}
function interact(){if(state.mode==='create'||state.mode==='ending')return;if(state.x<72||state.x>568){setCar(state.x<72?-1:1);return}if(Math.hypot(state.x-477,state.y-190)<105){talk();return}let clue=cluePosition();if(!state.clues.includes(state.car)&&Math.hypot(state.x-clue.x,state.y-clue.y)<48){inspectClue();return}showToast('Nothing nearby to inspect. Walk to a passenger, clue, or carriage door.')}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function finish(){state.ending=true;document.getElementById('dialogue').classList.remove('show');state.mode='ending';document.body.classList.add('show-case','ended');renderPanel();say('Case closed',`“E.V.” — Edward Vale, the physician. The three clues place him in cabin six at 11:32, staging a disappearance to flee his debts. Dr. Vale is escorted off at Black Hollow. Well done, ${state.name||'Detective'}.`);play.innerHTML='↻ &nbsp; Play again';play.onclick=()=>location.reload()}
function startGame(){state.mode='play';state.car=0;state.x=88;state.y=250;state.petX=63;state.petY=262;document.body.classList.add('playing');renderPanel();document.getElementById('status').textContent='THE ROYAL NIGHT MAIL · LONDON TO BLACK HOLLOW';say('The conductor',`Tickets, please! ${state.name||'Detective'}, your cabin is this way. Keep your ${state.petName||'companion'} close tonight… there’s a mystery aboard.`)}
function setCar(d){if(state.mode==='create'){state.pet=(state.pet+d+3)%3;renderPanel();return}if(state.mode==='ending')return;state.car=(state.car+d+3)%3;state.x=d>0?52:588;state.y=250;state.target=null;state.petX=state.x-24;state.petY=262;hideDialogue();renderPanel();document.getElementById('status').textContent=`THE ROYAL NIGHT MAIL · ${['11:47 PM','11:53 PM','12:02 AM'][state.car]} · ${['OBSERVATION SALOON','DINING CAR','SLEEPING CAR'][state.car]}`;state.walk+=d;showToast(`Through the door: ${carriages[state.car].name}`)}
function setDirection(dir,on){state.keys[dir]=on;if(on)state.target=null}
for(const [id,dir] of [['prev','ArrowLeft'],['next','ArrowRight']]){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();setDirection(dir,true)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>setDirection(dir,false)}
document.getElementById('touchPad').querySelectorAll('[data-dir]').forEach(b=>{const dir={left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown'}[b.dataset.dir];b.onpointerdown=e=>{e.preventDefault();setDirection(dir,true)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>setDirection(dir,false)});document.querySelector('[data-act="interact"]').onclick=interact;
document.getElementById('caseToggle').onclick=()=>document.body.classList.toggle('show-case');
play.onclick=()=>{if(state.mode==='create')startGame();else if(state.mode==='ending')location.reload();else if(state.clues.length===3)finish();else{document.body.classList.remove('show-case');showToast('Walk to a carriage door and press E to travel.')}};
document.getElementById('dialogue').onclick=hideDialogue;
canvas.addEventListener('click',e=>{if(state.mode!=='play')return;let b=canvas.getBoundingClientRect(),scale=Math.min(b.width/640,b.height/360),drawW=640*scale,drawH=360*scale,offsetX=(b.width-drawW)/2,offsetY=(b.height-drawH)/2,x=(e.clientX-b.left-offsetX)/scale,y=(e.clientY-b.top-offsetY)/scale;if(x<0||x>640||y<0||y>360)return;state.target={x:Math.max(42,Math.min(598,x)),y:Math.max(220,Math.min(282,y))}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)){e.preventDefault();setDirection(k.startsWith('arrow')?e.key:k,true)}else if(k==='e'||k==='enter'){e.preventDefault();interact()}else if(e.key===' '){e.preventDefault();hideDialogue()}else if(k==='c'){document.body.classList.toggle('show-case')}});
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k))setDirection(k.startsWith('arrow')?e.key:k,false)});window.addEventListener('blur',()=>{state.keys={}});
renderPanel();draw();
</script>
